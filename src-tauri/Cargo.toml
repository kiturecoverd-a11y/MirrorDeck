[package]
name = "mirrordeck"
version = "0.1.0"
description = "MirrorDeck — premium Android device management & screen mirroring powered by the official Nova engine"
edition = "2021"
rust-version = "1.77"

[lib]
name = "mirrordeck_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "net", "time", "rt-multi-thread", "macros"] }
rusqlite = { version = "0.31", features = ["bundled"] }
directories = "5"
thiserror = "1"
rfd = "0.15"
sysinfo = "0.30"
log = "0.4"
env_logger = "0.11"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
